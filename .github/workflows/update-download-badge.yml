name: Update Download Badge

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ["Desktop Multi-Platform Release"]
    types: [completed]

permissions:
  contents: write

jobs:
  update-badge:
    name: Sync Total Downloads Badge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Assets Branch
        uses: actions/checkout@v4
        with:
          ref: assets
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate Total Downloads and Update SVG
        run: |
          set -e
          TOTAL=$(curl -s -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/efzynx/BitChord-Desktop/releases" | \
            jq '[.[].assets[].download_count] | add // 0')

          echo "Calculated Total Downloads: $TOTAL"

          if [ -z "$TOTAL" ] || [ "$TOTAL" -eq 0 ]; then
            echo "Download count returned 0 or empty, keeping current badge."
            exit 0
          fi

          BADGE_PATH="badges/badge-downloads.svg"
          if [ ! -f "$BADGE_PATH" ]; then
            mkdir -p badges
          fi

          # Compute adaptive SVG width based on digit length
          DIGITS=${#TOTAL}
          EXTRA_WIDTH=$(( (DIGITS > 2 ? DIGITS - 2 : 0) * 8 ))
          SVG_WIDTH=$(( 132 + EXTRA_WIDTH ))
          RECT_WIDTH=$(( SVG_WIDTH - 1 ))

          cat << SVG_EOF > "$BADGE_PATH"
          <svg xmlns="http://www.w3.org/2000/svg" width="$SVG_WIDTH" height="30" viewBox="0 0 $SVG_WIDTH 30">
            <defs>
              <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#181b24"/>
                <stop offset="100%" stop-color="#11131a"/>
              </linearGradient>
            </defs>
            <rect x="0.5" y="0.5" width="$RECT_WIDTH" height="29" rx="14.5" fill="url(#bg)" stroke="#2d3342" stroke-width="1"/>
            <g transform="translate(11, 7)">
              <path d="M8 2v8M4.5 6.5L8 10l3.5-3.5" fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M2 11.5v1a1.5 1.5 0 0 0 1.5 1.5h9a1.5 1.5 0 0 0 1.5-1.5v-1" fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-linecap="round"/>
            </g>
            <text x="34" y="19.5" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" letter-spacing="0.2">Downloads: $TOTAL</text>
          </svg>
          SVG_EOF

          # Format cleanly (remove leading indentations from heredoc)
          sed -i 's/^ *//' "$BADGE_PATH"

          if git diff --quiet "$BADGE_PATH"; then
            echo "Badge is already up to date with $TOTAL downloads."
          else
            echo "Badge updated to $TOTAL downloads. Committing..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$BADGE_PATH"
            git commit -m "chore(assets): update downloads counter to $TOTAL"
            git push origin assets
          fi
