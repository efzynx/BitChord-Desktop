name: Desktop Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Target Version (e.g. 1.9.1)'
        required: false
        default: ''
      draft:
        description: 'Publish as draft release'
        type: boolean
        default: false
      prerelease:
        description: 'Publish as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Packages (AppImage, DEB, RPM, Tar.gz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install Packaging Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg-dev rpm wget file libfuse2

      - name: Grant Execute Permission for Gradle & Scripts
        run: |
          chmod +x gradlew
          chmod +x desktopApp/packaging/appimage.sh

      - name: Determine Version
        id: version_step
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(git describe --tags --always | sed 's/^v//')
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building BitChord Desktop version $VERSION"

      - name: Build Linux Distributable & Packages
        run: |
          ./gradlew :desktopApp:createDistributable :desktopApp:packageDeb :desktopApp:packageRpm -Pbitchord.version="${{ env.VERSION }}" --no-daemon

      - name: Package Linux Tar.gz Portable
        run: |
          mkdir -p dist/linux
          tar -czvf dist/linux/BitChord-${{ env.VERSION }}-linux-x64.tar.gz -C desktopApp/build/compose/binaries/main/app BitChord

      - name: Package AppImage
        run: |
          mkdir -p dist/linux
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./desktopApp/packaging/appimage.sh \
            desktopApp/build/compose/binaries/main/app/BitChord \
            dist/linux/BitChord-${{ env.VERSION }}-x86_64.AppImage \
            "$PWD/appimagetool"

      - name: Collect DEB and RPM packages
        run: |
          mkdir -p dist/linux
          find desktopApp/build/compose/binaries -name "*.deb" -exec cp {} dist/linux/ \;
          find desktopApp/build/compose/binaries -name "*.rpm" -exec cp {} dist/linux/ \;
          ls -lh dist/linux/

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-linux-packages
          path: dist/linux/*

  build-windows:
    name: Build Windows Packages (Portable Zip, MSI, EXE)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Determine Version
        id: version_step
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(git describe --tags --always | sed 's/^v//')
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building BitChord Windows Desktop version $VERSION"

      - name: Build Windows Portable Zip
        shell: cmd
        run: |
          call gradlew.bat :desktopApp:windowsPortable -Pbitchord.target=windows -Pbitchord.version="%VERSION%" --no-daemon

      - name: Build Windows MSI and EXE Installers
        shell: cmd
        run: |
          call gradlew.bat :desktopApp:packageReleaseMsi :desktopApp:packageReleaseExe -Pbitchord.target=windows -Pbitchord.version="%VERSION%" --no-daemon

      - name: Collect Windows Packages
        shell: bash
        run: |
          mkdir -p dist/windows
          find desktopApp/build/distributions -name "*windows-portable.zip" -exec cp {} dist/windows/ \;
          find desktopApp/build/compose/binaries -name "*.msi" -exec cp {} dist/windows/ \;
          find desktopApp/build/compose/binaries -name "*.exe" -exec cp {} dist/windows/ \;
          ls -lh dist/windows/

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-windows-packages
          path: dist/windows/*

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: bitchord-linux-packages
          path: release-assets/

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: bitchord-windows-packages
          path: release-assets/

      - name: Generate SHA256 Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd -

      - name: Determine Release Tag and Title
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG_NAME="v${{ github.event.inputs.version }}"
            RELEASE_TITLE="BitChord Desktop v${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            RELEASE_TITLE="BitChord Desktop ${GITHUB_REF#refs/tags/}"
          else
            VERSION="1.9.1"
            TAG_NAME="v1.9.1"
            RELEASE_TITLE="BitChord Desktop v1.9.1"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "RELEASE_TITLE=$RELEASE_TITLE" >> $GITHUB_ENV

      - name: Generate Release Notes Body
        run: |
          cat << 'EOF' > release-notes.md
          # BitChord Desktop ${{ env.VERSION }}

          Modern, high-performance desktop music player powered by Compose Multiplatform for Linux and Windows.

          ### Downloads & Packages

          | Platform | Package Type | Filename Pattern | Description |
          | :--- | :--- | :--- | :--- |
          | **Linux** | AppImage | `BitChord-*-x86_64.AppImage` | Universal Linux standalone executable (chmod +x & run) |
          | **Linux** | DEB | `bitchord_*.deb` | Debian, Ubuntu, Linux Mint, Pop!_OS package |
          | **Linux** | RPM | `bitchord-*.rpm` | Fedora, RHEL, openSUSE package |
          | **Linux** | Tar.gz | `BitChord-*-linux-x64.tar.gz` | Portable archive, extract and execute `./BitChord/bin/BitChord` |
          | **Windows** | Setup EXE | `BitChord-*.exe` | Modern per-user installer |
          | **Windows** | MSI | `BitChord-*.msi` | Windows Installer package |
          | **Windows** | Portable ZIP | `BitChord-*-windows-portable.zip` | Standalone portable bundle, no installation needed |

          ---

          ### Key Desktop Features

          - **Native Media Control Integration**: Linux MPRIS D-Bus player controls (Playerctl, GNOME/KDE media widgets) and Windows SMTC (System Media Transport Controls).
          - **Unthrottled Audio Streaming**: Built-in headless JavaFX WebEngine PoToken generation to bypass YouTube playback limits with HTTP Range audio chunking.
          - **Studio Audio Fidelity**: Full lossless FLAC & Hi-Res Opus streaming via native FFmpeg 7.1 audio decoders and crossfade transitions.
          - **Synchronized Lyrics**: Word-by-word and line-by-line real-time lyrics renderer with smooth scrolling.
          - **Discord Rich Presence**: Native IPC Rich Presence integration displaying current track title, artist, playback state, and timestamp.
          - **Offline Storage & Local Library**: Background audio caching and local disk audio library scanner.
          - **In-App Updater**: Direct release notification and version check against GitHub releases.

          ---

          ### Verification (SHA-256)

          ```text
          EOF
          cat release-assets/SHA256SUMS.txt >> release-notes.md
          cat << 'EOF' >> release-notes.md
          ```

          ---
          EOF

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_TITLE }}
          body_path: release-notes.md
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          files: |
            release-assets/*
          generate_release_notes: true
