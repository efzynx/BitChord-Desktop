name: Desktop Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Target Version (e.g. 1.8-beta1)'
        required: false
        default: ''
      draft:
        description: 'Publish as draft release'
        type: boolean
        default: false
      prerelease:
        description: 'Publish as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Packages (AppImage, DEB, RPM, Tar.gz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install Packaging Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg-dev rpm wget file libfuse2

      - name: Grant Execute Permission for Gradle & Scripts
        run: |
          chmod +x gradlew
          chmod +x desktopApp/packaging/appimage.sh

      - name: Determine Version
        id: version_step
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(git describe --tags --always | sed 's/^v//')
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building BitChord Desktop version $VERSION"

      - name: Build Linux Distributable & Packages
        run: |
          ./gradlew :desktopApp:createDistributable :desktopApp:packageDeb :desktopApp:packageRpm -Pbitchord.version="${{ env.VERSION }}" --no-daemon

      - name: Package Linux Tar.gz Portable
        run: |
          mkdir -p dist/linux
          cd desktopApp/build/compose/binaries/main/app
          tar -czvf "../../../../../dist/linux/BitChord-${{ env.VERSION }}-linux-x64.tar.gz" BitChord
          cd -

      - name: Package AppImage
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./desktopApp/packaging/appimage.sh \
            desktopApp/build/compose/binaries/main/app/BitChord \
            dist/linux/BitChord-${{ env.VERSION }}-x86_64.AppImage \
            ./appimagetool

      - name: Collect DEB and RPM packages
        run: |
          find desktopApp/build/compose/binaries/main/deb -name "*.deb" -exec cp {} dist/linux/ \; || true
          find desktopApp/build/compose/binaries/main/rpm -name "*.rpm" -exec cp {} dist/linux/ \; || true
          ls -lh dist/linux/

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-linux-packages
          path: dist/linux/*

  build-windows:
    name: Build Windows Packages (Portable Zip, MSI, EXE)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Determine Version
        id: version_step
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(git describe --tags --always | sed 's/^v//')
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building BitChord Windows Desktop version $VERSION"

      - name: Build Windows Portable Zip
        shell: cmd
        run: |
          call gradlew.bat :desktopApp:windowsPortable -Pbitchord.target=windows -Pbitchord.version="%VERSION%" --no-daemon

      - name: Build Windows MSI and EXE Installers
        shell: cmd
        run: |
          call gradlew.bat :desktopApp:packageReleaseMsi :desktopApp:packageReleaseExe -Pbitchord.target=windows -Pbitchord.version="%VERSION%" --no-daemon

      - name: Collect Windows Packages
        shell: bash
        run: |
          mkdir -p dist/windows
          find desktopApp/build/distributions -name "*windows-portable.zip" -exec cp {} dist/windows/ \; || true
          find desktopApp/build/compose/binaries/main/msi -name "*.msi" -exec cp {} dist/windows/ \; || true
          find desktopApp/build/compose/binaries/main/exe -name "*.exe" -exec cp {} dist/windows/ \; || true
          ls -lh dist/windows/

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-windows-packages
          path: dist/windows/*

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: bitchord-linux-packages
          path: release-assets/

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: bitchord-windows-packages
          path: release-assets/

      - name: Generate SHA256 Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd -

      - name: Determine Release Tag and Title
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG_NAME="v${{ github.event.inputs.version }}"
            RELEASE_TITLE="BitChord Desktop v${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            RELEASE_TITLE="BitChord Desktop ${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v1.8-beta1"
            RELEASE_TITLE="BitChord Desktop v1.8-beta1"
          fi
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "RELEASE_TITLE=$RELEASE_TITLE" >> $GITHUB_ENV

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_TITLE }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          files: |
            release-assets/*
          generate_release_notes: true
