name: Desktop Multi-Platform Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Target Version (e.g. 1.9.2-beta.1)'
        required: false
        default: ''
      draft:
        description: 'Publish as draft release'
        type: boolean
        default: false
      prerelease:
        description: 'Publish as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare Release & Auto-Tag
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      tag_name: ${{ steps.check.outputs.tag_name }}
      is_prerelease: ${{ steps.check.outputs.is_prerelease }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Version & Handle Tagging
        id: check
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(sed -n 's/.*extra\["bitchordVersionName"\] = "\(.*\)".*/\1/p' build.gradle.kts)
          fi

          if [ -z "$VERSION" ]; then
            echo "Error: Could not determine version from build.gradle.kts or inputs."
            exit 1
          fi

          TAG="v$VERSION"
          echo "Target Version: $VERSION"
          echo "Target Tag: $TAG"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT

          if [[ "$VERSION" =~ (beta|alpha|rc|preview) ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

          if [[ "${{ github.ref }}" == refs/tags/v* ]] || [ -n "${{ github.event.inputs.version }}" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Explicit release trigger detected. Proceeding with release build."
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            # Triggered by push/merge to main branch
            if git rev-parse "$TAG" >/dev/null 2>&1 || git ls-remote --tags origin | grep -q "refs/tags/$TAG$"; then
              echo "Tag $TAG already exists on remote repository. Skipping release build for existing version."
              echo "should_release=false" >> $GITHUB_OUTPUT
            else
              echo "Tag $TAG does not exist yet. Creating tag and initiating automatic release."
              echo "should_release=true" >> $GITHUB_OUTPUT

              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git tag -a "$TAG" -m "Release $TAG"
              git push origin "$TAG"
            fi
          fi

  build-linux:
    name: Build Linux Packages (AppImage, DEB, RPM, Tar.gz)
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare-release.outputs.version }}
      GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install Packaging Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg-dev rpm wget file libfuse2

      - name: Grant Execute Permission for Gradle & Scripts
        run: |
          chmod +x gradlew
          chmod +x desktopApp/packaging/appimage.sh

      - name: Display Target Version
        run: |
          echo "Building BitChord Desktop version ${{ env.VERSION }}"

      - name: Build Linux Distributable & Packages
        run: |
          ./gradlew :desktopApp:createDistributable :desktopApp:packageDeb :desktopApp:packageRpm -Pbitchord.version="${{ env.VERSION }}" --no-daemon

      - name: Package Linux Tar.gz Portable
        run: |
          mkdir -p dist/linux
          tar -czvf dist/linux/BitChord-${{ env.VERSION }}-linux-x64.tar.gz -C desktopApp/build/compose/binaries/main/app BitChord

      - name: Package AppImage
        run: |
          mkdir -p dist/linux
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./desktopApp/packaging/appimage.sh \
            desktopApp/build/compose/binaries/main/app/BitChord \
            dist/linux/BitChord-${{ env.VERSION }}-x86_64.AppImage \
            "$PWD/appimagetool"

      - name: Collect DEB and RPM packages
        run: |
          mkdir -p dist/linux
          for f in $(find desktopApp/build/compose/binaries -name "*.deb"); do
            cp "$f" "dist/linux/bitchord_${{ env.VERSION }}_amd64.deb"
          done
          for f in $(find desktopApp/build/compose/binaries -name "*.rpm"); do
            cp "$f" "dist/linux/bitchord-${{ env.VERSION }}.x86_64.rpm"
          done
          ls -lh dist/linux/

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-linux-packages
          path: dist/linux/*

  build-windows:
    name: Build Windows Packages (Portable Zip, MSI, EXE)
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.prepare-release.outputs.version }}
      GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Display Target Version
        shell: bash
        run: |
          echo "Building BitChord Windows Desktop version ${{ env.VERSION }}"

      - name: Ensure Inno Setup 6 is Available
        shell: powershell
        run: |
          $isccPaths = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $found = $isccPaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $found) {
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($cmd) { $found = $cmd.Source }
          }
          if (-not $found) {
            Write-Host "Installing Inno Setup via Chocolatey..."
            choco install innosetup -y --no-progress
          } else {
            Write-Host "Found Inno Setup compiler at $found"
          }

      - name: Build Windows Portable Zip
        shell: cmd
        run: |
          call gradlew.bat :desktopApp:windowsPortable -Pbitchord.target=windows -Pbitchord.version="%VERSION%" --no-daemon

      - name: Build Windows Setup EXE (Inno Setup) and MSI
        shell: cmd
        run: |
          call gradlew.bat :desktopApp:packageWindowsInstaller :desktopApp:packageReleaseMsi -Pbitchord.target=windows -Pbitchord.version="%VERSION%" --no-daemon

      - name: Collect Windows Packages
        shell: bash
        run: |
          mkdir -p dist/windows
          find desktopApp/build/distributions -name "*windows-portable.zip" -exec cp {} dist/windows/ \;
          cp "desktopApp/build/distributions/BitChord-${{ env.VERSION }}.exe" "dist/windows/BitChord-${{ env.VERSION }}.exe"
          for f in $(find desktopApp/build/compose/binaries -name "*.msi"); do
            cp "$f" "dist/windows/BitChord-${{ env.VERSION }}.msi"
          done
          ls -lh dist/windows/

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-windows-packages
          path: dist/windows/*

  publish-release:
    name: Publish GitHub Release
    needs: [prepare-release, build-linux, build-windows]
    if: needs.prepare-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare-release.outputs.version }}
      TAG_NAME: ${{ needs.prepare-release.outputs.tag_name }}
      RELEASE_TITLE: BitChord Desktop ${{ needs.prepare-release.outputs.tag_name }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: bitchord-linux-packages
          path: release-assets/

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: bitchord-windows-packages
          path: release-assets/

      - name: Generate SHA256 Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd -

      - name: Generate Release Notes Body
        run: |
          cat << 'EOF' > release-notes.md
          <p align="center">
            <img src="https://raw.githubusercontent.com/efzynx/BitChord-Desktop/assets/banners/banner-v1.10.0-bd.webp" alt="BitChord Desktop Release Banner" width="100%" />
          </p>

          # ${{ env.RELEASE_TITLE }}

          BitChord Desktop is an aesthetic, high-performance desktop music player for Linux and Windows powered by Compose Multiplatform and native FFmpeg 7.1.

          ---

          ### Highlights & Changelog

          #### Upstream BitChord 1.10 Synchronization
          - **AutoMix & Canvas Transitions**: Seamless track blending with organic artwork transitions, Spotify Canvas handling, mixing badges, and nested settings controls.
          - **Enhanced Queue & Playlists**: Queue multi-select mode with bulk playlist actions, swipe gestures, undo snackbars, and automatic upcoming songs focus.
          - **Timed Lyrics Synchronization**: Real-time line and syllable synchronization from YouTube Music, LRCLIB, and Musixmatch with extended glow feathering.
          - **Library & Download Improvements**: Isolated artwork per local audio track, auto-download for liked tracks, and audio fade-out for sleep timers.

          #### Desktop Enhancements & Fixes
          - **Listen Together Overhaul**: Quick Party mode powered by dedicated VPS (`party.bitchord.my.id`) alongside local Cloudflare Quick Tunnel (`cloudflared`).
          - **Animated Artist Banners**: High-definition HLS video banners for artist profile headers with user opt-in toggle.
          - **Best Part Scrubber Highlights**: Visual markers for popular song segments directly on the scrubber timeline.
          - **AutoMix Artwork Controls**: Fine-grained settings for mini-player art transitions and background canvas blending.
          - **Playlist & Library Management**: Full support for renaming, deleting, and editing both local and account playlists from the sidebar.
          - **Performance & Packaging**: Native Linux AppImage packaging task, Windows Haze blur stability fix, and reduced memory usage.
          - **Static Web Portal**: Official GitHub Pages landing page with Apple Liquid Glass aesthetic, ambient glow, and dual-language switch.

          ---

          ### Downloads & Packages

          | Platform | Package Type | Filename Pattern | Description |
          | :--- | :--- | :--- | :--- |
          | **Linux** | AppImage | `BitChord-*-x86_64.AppImage` | Universal Linux standalone executable (chmod +x & run) |
          | **Linux** | DEB | `bitchord_*.deb` | Debian, Ubuntu, Linux Mint, Pop!_OS package |
          | **Linux** | RPM | `bitchord-*.rpm` | Fedora, RHEL, openSUSE package |
          | **Linux** | Tar.gz | `BitChord-*-linux-x64.tar.gz` | Portable archive, extract and execute `./BitChord/bin/BitChord` |
          | **Windows** | Setup EXE | `BitChord-*.exe` | Modern per-user installer |
          | **Windows** | MSI | `BitChord-*.msi` | Windows Installer package |
          | **Windows** | Portable ZIP | `BitChord-*-windows-portable.zip` | Standalone portable bundle, no installation needed |

          ---

          ### Key Desktop Features

          - **Native Media Control Integration**: Linux MPRIS D-Bus player controls (Playerctl, GNOME/KDE media widgets) and Windows SMTC (System Media Transport Controls).
          - **Unthrottled Audio Streaming**: Built-in headless JavaFX WebEngine PoToken generation to bypass YouTube playback limits with HTTP Range audio chunking.
          - **Studio Audio Fidelity**: Full lossless FLAC & Hi-Res Opus streaming via native FFmpeg 7.1 audio decoders and crossfade transitions.
          - **Synchronized Lyrics**: Word-by-word and line-by-line real-time lyrics renderer with smooth scrolling.
          - **Discord Rich Presence**: Native IPC Rich Presence integration displaying current track title, artist, playback state, and timestamp.
          - **Offline Storage & Local Library**: Background audio caching and local disk audio library scanner.
          - **In-App Updater**: Direct release notification and version check against GitHub releases.

          ---

          ### Verification (SHA-256)

          ```text
          EOF
          cat release-assets/SHA256SUMS.txt >> release-notes.md
          cat << 'EOF' >> release-notes.md
          ```

          ---
          EOF

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_TITLE }}
          body_path: release-notes.md
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || needs.prepare-release.outputs.is_prerelease == 'true' }}
          files: |
            release-assets/*
          generate_release_notes: true

      - name: Update README.md Download Links (Stable Release)
        if: needs.prepare-release.outputs.is_prerelease == 'false' && !(github.event.inputs.draft == true)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git pull origin main || true

          # Update direct download links in README.md table and release badge
          sed -i -E "s|releases/download/v[0-9]+\.[0-9]+\.[0-9]+/BitChord-[0-9]+\.[0-9]+\.[0-9]+-x86_64\.AppImage|releases/download/${{ env.TAG_NAME }}/BitChord-${{ env.VERSION }}-x86_64.AppImage|g" README.md
          sed -i -E "s|releases/download/v[0-9]+\.[0-9]+\.[0-9]+/bitchord_[0-9]+\.[0-9]+\.[0-9]+_amd64\.deb|releases/download/${{ env.TAG_NAME }}/bitchord_${{ env.VERSION }}_amd64.deb|g" README.md
          sed -i -E "s|releases/download/v[0-9]+\.[0-9]+\.[0-9]+/bitchord-[0-9]+\.[0-9]+\.[0-9]+\.x86_64\.rpm|releases/download/${{ env.TAG_NAME }}/bitchord-${{ env.VERSION }}.x86_64.rpm|g" README.md
          sed -i -E "s|releases/download/v[0-9]+\.[0-9]+\.[0-9]+/BitChord-[0-9]+\.[0-9]+\.[0-9]+-linux-x64\.tar\.gz|releases/download/${{ env.TAG_NAME }}/BitChord-${{ env.VERSION }}-linux-x64.tar.gz|g" README.md
          sed -i -E "s|releases/download/v[0-9]+\.[0-9]+\.[0-9]+/BitChord-[0-9]+\.[0-9]+\.[0-9]+\.exe|releases/download/${{ env.TAG_NAME }}/BitChord-${{ env.VERSION }}.exe|g" README.md
          sed -i -E "s|releases/download/v[0-9]+\.[0-9]+\.[0-9]+/BitChord-[0-9]+\.[0-9]+\.[0-9]+\.msi|releases/download/${{ env.TAG_NAME }}/BitChord-${{ env.VERSION }}.msi|g" README.md
          sed -i -E "s|releases/download/v[0-9]+\.[0-9]+\.[0-9]+/BitChord-[0-9]+\.[0-9]+\.[0-9]+-windows-portable\.zip|releases/download/${{ env.TAG_NAME }}/BitChord-${{ env.VERSION }}-windows-portable.zip|g" README.md
          sed -i -E "s|alt=\"Release v[0-9]+\.[0-9]+\.[0-9]+\"|alt=\"Release ${{ env.TAG_NAME }}\"|g" README.md

          if git diff --quiet README.md; then
            echo "README.md download links are already up to date."
          else
            git add README.md
            git commit -m "chore(release): update direct download links in README to ${{ env.TAG_NAME }} [skip ci]"
            git push origin main
          fi
